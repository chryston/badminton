<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Badminton Admin</title>
  <script>
    // GitHub Pages SPA redirect hack
    // Redirects /badminton/some/path to /?p=/some/path then App.tsx restores it
    var seg = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
</html>
